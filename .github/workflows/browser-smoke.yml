name: 3D Pipe - Browser WebGL2 Smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'pipeline/browser_smoke.mjs'
      - 'browser-smoke.html'
      - '.github/workflows/browser-smoke.yml'
permissions:
  contents: read
jobs:
  gpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only browser test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Serve local fixture and verify actual WebGL pixels
        run: |
          python3 -m http.server 8118 --bind 127.0.0.1 > /tmp/3d-pipe-http.log 2>&1 &
          for i in {1..15}; do curl -fsS http://127.0.0.1:8118/browser-smoke.html >/dev/null && break; sleep 1; done
          node pipeline/browser_smoke.mjs artifacts/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-webgl2-smoke
          path: artifacts/browser/
          if-no-files-found: ignore
