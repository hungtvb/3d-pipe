name: 3D Pipe - Village Blender Review
on:
  workflow_dispatch:
  push:
    paths:
      - 'pipeline/blender_scene_review.py'
      - 'pipeline/build_blockout.py'
      - 'examples/village-blockout/scene.json'
      - '.github/workflows/village-blender.yml'
permissions:
  contents: read
jobs:
  cycles-four-view:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate scene GLB and structural audit
        run: |
          python -m pipeline.build_blockout --manifest examples/village-blockout/scene.json --out artifacts/village-blockout.glb
          python -m pipeline.glb_gate audit --file artifacts/village-blockout.glb --triangle-budget 2500 --out artifacts/audit.json
      - name: Install Blender 4.5 LTS
        uses: bradyajohnston/setup-blender@v5
        with:
          version: '4.5.15'
      - name: Render 4 views from real generated village
        run: blender -b --factory-startup --python pipeline/blender_scene_review.py -- --input artifacts/village-blockout.glb --output artifacts/blender-village --samples 12
      - name: Verify native scene and images
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          root=Path("artifacts/blender-village")
          report=json.loads((root/"report.json").read_text())
          assert report["imported_meshes"]>0
          assert report["renderer"]=="CYCLES"
          assert (root/"village-review.blend").stat().st_size>10000
          assert len(report["views"])==4
          for view in report["views"]:
              image=Image.open(root/view["file"]).convert("RGB")
              assert image.size==(720,450)
              unique=len(set(image.resize((80,50)).getdata()))
              assert unique>20, (view["name"],unique)
              print(view["name"],"PNG valid, unique sampled colors:",unique)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: village-blender-cycles-four-view
          path: |
            artifacts/blender-village/
            artifacts/audit.json
          if-no-files-found: warn
